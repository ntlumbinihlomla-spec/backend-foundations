[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-foundations"
version = "0.1.0"
description = "A professional command-line calculator tool built in Python."
authors = [{ name="Hlomla Ntlumbini", email="ntlumbinihlomla@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.scripts]
calculator = "calculator.app:main"
task-api = "task_api.server:main"
calculator-api = "calculator.api:run"
