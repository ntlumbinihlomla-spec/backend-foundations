services:
  - type: web
    name: backend-foundations-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn calculator.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: "5242880"
      - key: ALLOW_LOCAL_FOLDER_BATCH
        value: "false"
